# One wheel per platform, each carrying its own libobook, built and published by
# .github/workflows/python-wheels.yml (docs/PYTHON.md §6).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "obook"
version = "0.1.0"
description = "Python bindings for the intrepidkarthi/orderbook matching engine, over its C ABI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Source = "https://github.com/intrepidkarthi/orderbook"
Documentation = "https://github.com/intrepidkarthi/orderbook/blob/main/docs/PYTHON.md"

[tool.setuptools]
packages = ["obook"]

[tool.setuptools.package-data]
obook = ["libobook.so", "libobook.dylib"]
