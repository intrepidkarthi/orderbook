# cmd/ and examples/ are binaries and runnable demonstrations: their bodies are
# main() wiring, and the behaviour underneath them is covered by pkg/ and by
# cmd/obgw's own end-to-end suite. Counting them reports the library as less
# tested than it is -- 73.4% across every package against 83.8% with these
# ignored, on the same run.
ignore:
  - "cmd/**"
  - "examples/**"
  - "legacy/**"

coverage:
  status:
    project:
      default:
        # 83.8% measured at v0.26.0. The target is the floor it must not fall
        # through, not the number it currently is.
        target: 80%
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 5%

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
