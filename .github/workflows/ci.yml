name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build · vet · test (race) · go${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the README claims, and the current release. Running both is
        # what makes "Requires Go 1.23 or later" a checked claim rather than a
        # stated one -- a floor nothing builds against is a floor nobody has
        # tested. Bump the second entry when Go releases; the first moves only
        # when the go directive in go.mod does.
        go: ["1.23", "1.27"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "${{ matrix.go }}"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # Not -race: the coverage number is the subject here, and the race
      # detector's instrumentation is not free on the 66-second wal suite.
      - name: Test (coverage)
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
