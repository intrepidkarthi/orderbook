name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build · vet · test (race) · go${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the README claims, and the current release. Running both is
        # what makes "Requires Go 1.23 or later" a checked claim rather than a
        # stated one -- a floor nothing builds against is a floor nobody has
        # tested. Bump the second entry when Go releases; the first moves only
        # when the go directive in go.mod does.
        go: ["1.23", "1.27"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "${{ matrix.go }}"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # A gate, not a badge. This fails the build when coverage over the
      # packages a consumer imports drops through the floor -- which a coverage
      # service reports and never enforces. Not -race: the number is the subject
      # here, and the detector's instrumentation is not free on the wal suite.
      #
      # Reproduce locally with the same command: `make cover-check`.
      - name: Coverage floor
        run: make cover-check

  python:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # Builds libobook from this commit into the package and runs the tests
      # (docs/PYTHON.md §4), including bench-basic-v1 through Python to the committed
      # digest. 3.9 is the oldest Python the package claims.
      - name: obook
        run: make python
