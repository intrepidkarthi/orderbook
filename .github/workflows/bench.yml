name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - "pkg/**"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Run benchmarks (published to the run summary)
        run: |
          {
            echo '## Benchmark results'
            echo ''
            echo 'GitHub-hosted runner · `go test -bench -benchmem`'
            echo ''
            echo '### Matching core'
            echo ''
            echo 'The bare engine: the fastest configuration the library offers.'
            echo ''
            echo '```'
            go test -run '^$' -bench=. -benchmem ./pkg/orderbook/ ./pkg/matching/
            echo '```'
            echo ''
            echo '### Durable path'
            echo ''
            echo 'Runner + EventSink + write-ahead log — the configuration the'
            echo 'documentation actually recommends embedding. Publishing only the'
            echo 'numbers above would advertise a path most callers do not use.'
            echo ''
            echo '```'
            go test -run '^$' -bench=. -benchmem ./pkg/wal/
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
